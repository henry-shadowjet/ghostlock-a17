name: Build GhostLock Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the exploit source code
    - name: Checkout project code
      uses: actions/checkout@v4
      with:
        ref: main

    # 2. Force compile the exact target binaries explicitly
    - name: Compile Exploit Binaries
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
        export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        
        mkdir -p $GITHUB_WORKSPACE/output_binaries

        echo "=== Direct Targeting Compilation ==="

        # 1. Compile the main ghostlock exploit tool
        # (Locating the main exploit entry file dynamically if named uniquely)
        MAIN_EXPLOIT_FILE=$(find . -maxdepth 1 -name "*.c" ! -name "g4*" | head -n 1)
        if [ ! -z "$MAIN_EXPLOIT_FILE" ]; then
          echo "Compiling Main Exploit: $MAIN_EXPLOIT_FILE -> ghostlock"
          aarch64-linux-android34-clang $MAIN_EXPLOIT_FILE -o $GITHUB_WORKSPACE/output_binaries/ghostlock
        else
          echo "Compiling fallback root code -> ghostlock"
          aarch64-linux-android34-clang *.c -o $GITHUB_WORKSPACE/output_binaries/ghostlock || true
        fi

        # 2. Compile the g4d daemon tool if the file exists
        G4D_SOURCE=$(find . -name "*g4d*.c" -o -name "*daemon*.c" | head -n 1)
        if [ ! -z "$G4D_SOURCE" ]; then
          echo "Compiling Daemon: $G4D_SOURCE -> g4d"
          aarch64-linux-android34-clang $G4D_SOURCE -o $GITHUB_WORKSPACE/output_binaries/g4d
        fi

        # 3. Compile the g4sh shell client if the file exists
        G4SH_SOURCE=$(find . -name "*g4sh*.c" -o -name "*shell*.c" | head -n 1)
        if [ ! -z "$G4SH_SOURCE" ]; then
          echo "Compiling Shell Client: $G4SH_SOURCE -> g4sh"
          aarch64-linux-android34-clang $G4SH_SOURCE -o $GITHUB_WORKSPACE/output_binaries/g4sh
        fi

        # 4. Compile peripheral qemu test components just in case
        if [ -d "qemu-e2e" ]; then
          aarch64-linux-android34-clang qemu-e2e/fake_sh.c -o $GITHUB_WORKSPACE/output_binaries/fake_sh || true
          aarch64-linux-android34-clang qemu-e2e/init_e2e.c -o $GITHUB_WORKSPACE/output_binaries/init_e2e || true
        fi

    # 3. Export the explicit binary package
    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: ghostlock-output
        path: ${{ github.workspace }}/output_binaries/
