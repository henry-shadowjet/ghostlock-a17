name: Build Native NDK Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the C/C++ source code
    - name: Checkout project code
      uses: actions/checkout@v4
      with:
        ref: main

    # 2. Setup the Android NDK compiler environment
    - name: Install Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '26.1.10909125' # Installs an official Google NDK build toolchain

    # 3. Compile using the NDK's build tool (ndk-build or cmake)
    - name: Compile Exploit Binaries
      run: |
        if [ -f "jni/Android.mk" ] || [ -f "Android.mk" ]; then
          ndk-build
        elif [ -f "CMakeLists.txt" ]; then
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a ..
          make
        else
          echo "No standard Android NDK build files detected. Trying manual clang compilation..."
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang source.c -o ghostlock
        fi

    # 4. Save the compiled artifacts
    - name: Upload Compiled Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ghostlock-binaries
        path: |
          libs/
          build/
          ghostlock
