name: Build GhostLock Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the C source code
    - name: Checkout project code
      uses: actions/checkout@v4
      with:
        ref: main

    # 2. Download and unpack a clean standalone Android NDK directly
    - name: Download Standalone Android NDK
      run: |
        wget -q https://google.com
        unzip -q android-ndk-r26b-linux.zip
        echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26b" >> $GITHUB_ENV

    # 3. Compile using the NDK's native build tools
    - name: Compile Exploit Binaries
      run: |
        export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        
        # Check for standard NDK build files
        if [ -f "jni/Android.mk" ] || [ -f "Android.mk" ]; then
          $ANDROID_NDK_ROOT/ndk-build
        elif [ -f "CMakeLists.txt" ]; then
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a ..
          make
        else
          echo "No automated build script found. Attempting a direct manual compile..."
          # Locates any .c files to compile into an ARM64 Android executable binary
          aarch64-linux-android34-clang *.c -o ghostlock_exploit
        fi

    # 4. Save the compiled output
    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: ghostlock-output
        path: |
          libs/
          build/
          ghostlock_exploit
