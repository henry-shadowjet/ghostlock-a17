name: Build GhostLock Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the exploit source code
    - name: Checkout project code
      uses: actions/checkout@v4
      with:
        ref: main

    # 2. Compile using the runner's pre-installed Android NDK
    - name: Compile Exploit Binaries
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
        export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        
        mkdir -p $GITHUB_WORKSPACE/output_binaries

        # Check for automated build layout configurations
        if [ -f "jni/Android.mk" ] || [ -f "Android.mk" ]; then
          $ANDROID_NDK_ROOT/ndk-build
          cp -r libs/* $GITHUB_WORKSPACE/output_binaries/ || true
          
        elif [ -f "CMakeLists.txt" ]; then
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a ..
          make
          cp * $GITHUB_WORKSPACE/output_binaries/ 2>/dev/null || true
          
        else
          echo "No config files found. Compiling base files individually..."
          
          # Isolates and compiles only the main source files in the root folder,
          # avoiding collision with the secondary 'qemu-e2e' main functions.
          if [ -f "main.c" ] || [ -f "exploit.c" ]; then
             aarch64-linux-android34-clang *.c -o $GITHUB_WORKSPACE/output_binaries/ghostlock_exploit
          else
             echo "Compiling all top-level tools..."
             for f in *.c; do
               [ -f "$f" ] || continue
               aarch64-linux-android34-clang "$f" -o "$GITHUB_WORKSPACE/output_binaries/${f%.c}" || true
             done
          fi
          
          # Separately compile the qemu files into their own individual binaries
          if [ -d "qemu-e2e" ]; then
            echo "Compiling peripheral tools..."
            aarch64-linux-android34-clang qemu-e2e/fake_sh.c -o $GITHUB_WORKSPACE/output_binaries/fake_sh || true
            aarch64-linux-android34-clang qemu-e2e/init_e2e.c -o $GITHUB_WORKSPACE/output_binaries/init_e2e || true
          fi
        fi

    # 3. Export the resulting files
    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: ghostlock-output
        path: ${{ github.workspace }}/output_binaries/
