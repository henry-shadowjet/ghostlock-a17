name: Build GhostLock Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the exploit source code
    - name: Checkout project code
      uses: actions/checkout@v4
      with:
        ref: main

    # 2. Compile using the runner's pre-installed Android NDK
    - name: Compile Exploit Binaries
      run: |
        # Use the pre-loaded Android NDK path on the GitHub runner
        export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
        export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        
        echo "Using NDK located at: $ANDROID_NDK_ROOT"

        # Check for standard NDK build layouts
        if [ -f "jni/Android.mk" ] || [ -f "Android.mk" ]; then
          $ANDROID_NDK_ROOT/ndk-build
        elif [ -f "CMakeLists.txt" ]; then
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a ..
          make
        else
          echo "No automated build script found. Attempting manual aarch64 compilation..."
          # Compiles any local .c source files into a standalone ARM64 Linux/Android executable 
          aarch64-linux-android34-clang *.c -o ghostlock_exploit || echo "Compilation bypassed or skipped."
        fi

    # 3. Export the resulting files
    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: ghostlock-output
        path: |
          libs/
          build/
          ghostlock_exploit
